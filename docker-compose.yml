version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: filacerta-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-filacerta}
      POSTGRES_USER: ${POSTGRES_USER:-filacerta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filacerta123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - filacerta-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-filacerta}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: filacerta-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-filacerta}
      DB_USERNAME: ${POSTGRES_USER:-filacerta}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-filacerta123}
      FLYWAY_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - filacerta-network
    volumes:
      - ./backend/logs:/app/logs

  nginx:
    image: nginx:alpine
    container_name: filacerta-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - filacerta-network

networks:
  filacerta-network:
    driver: bridge

volumes:
  postgres_data: