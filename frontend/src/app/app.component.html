<!-- ESTAS DUAS LINHAS SÃO OBRIGATÓRIAS NO TOPO -->
<app-toast></app-toast>
<app-confirm-modal></app-confirm-modal>

<!-- 
  ⚠️ A classe `has-bottom-nav` adiciona padding-bottom SOMENTE 
  quando a navbar está visível (evita espaço extra em telas sem nav)
-->
<div class="min-h-screen flex flex-col bg-gray-50" [class.has-bottom-nav]="mostrarNavbar">
  @if (mostrarNavbar) {
    <app-navbar></app-navbar>
  }

  <main class="flex-1">
    <router-outlet></router-outlet>
    <app-lgpd-banner />
  </main>
</div>
