<div class="sobre-page">
  <!-- Botão voltar -->
  <button
    type="button"
    (click)="voltar()"
    class="sobre-voltar"
    aria-label="Voltar para a página anterior"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="w-4 h-4"
      aria-hidden="true"
    >
      <path d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
    </svg>
    Voltar
  </button>

  <!-- Card Principal -->
  <div class="sobre-card">
    <!-- Header / Capa -->
    <div class="sobre-capa">
      <div class="sobre-logo" aria-hidden="true">
        <span class="text-2xl">🍔</span>
      </div>
      <h1 class="sobre-titulo">Mikael Lanches</h1>
      <p class="sobre-slogan">Sua fome não precisa de fila.</p>
    </div>

    <div class="sobre-conteudo">
      <!-- Horários -->
      <section>
        <h2 class="sobre-section-titulo">Horário de Funcionamento</h2>
        <ul class="sobre-horarios">
          <li class="sobre-horario-item">
            <span>Quinta-feira a Domingo</span>
            <span class="sobre-horario-hora">15:00 - 00:00</span>
          </li>
          <li class="sobre-horario-item sobre-horario-fechado">
            <span>Segunda-feira a Quarta-feira</span>
            <span>Fechado</span>
          </li>
        </ul>
      </section>

      <!-- Endereço -->
      <section>
        <h2 class="sobre-section-titulo">Endereço</h2>
        <div class="sobre-endereco">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="sobre-endereco-icon"
            aria-hidden="true"
          >
            <path
              d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"
            ></path>
            <path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
          <p>
            Estrada do Barbalho, - Iputinga<br />
            Recife - PE
          </p>
        </div>
      </section>

      <!-- Botões de Contato -->
      <section class="sobre-contatos">
        <!-- WhatsApp -->
        <a
          href="https://wa.me/5581999999999"
          target="_blank"
          rel="noopener noreferrer"
          class="sobre-btn sobre-btn-whatsapp"
          aria-label="Falar no WhatsApp"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5" aria-hidden="true">
            <path
              d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.245 3.487 5.236 3.487 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.312 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.898-4.45 9.898-9.898 0-2.64-1.027-5.118-2.893-6.985-1.866-1.867-4.345-2.895-6.985-2.896-5.449 0-9.899 4.45-9.899 9.899 0 2.14.622 4.148 1.8 5.856l-1.168 4.269 4.364-1.157zm10.158-5.385c-.538-.27-3.176-1.567-3.668-1.747-.492-.18-.85-.27-1.21.27-.358.54-1.385 1.747-1.698 2.107-.313.36-.627.405-1.165.135-2.148-.962-3.882-2.315-5.35-4.402-.23-.33-.024-.51.245-.778.232-.23.538-.63.807-.945.269-.315.359-.54.539-.9.18-.36.09-.675-.045-.945-.135-.27-1.21-2.925-1.658-4.005-.434-1.047-.875-1.047-1.21-1.047-.313 0-.672-.045-1.031-.045-.359 0-.942.135-1.435.675-.493.54-1.883 1.845-1.883 4.5 0 2.655 1.928 5.22 2.197 5.58.269.36 3.807 5.805 9.22 8.145 1.288.555 2.293.885 3.076 1.125 1.293.405 2.471.345 3.4.21.928-.135 3.176-1.29 3.624-2.55.448-1.26.448-2.34.313-2.55-.135-.21-.493-.315-1.031-.585z"
            />
          </svg>
          Falar no WhatsApp
        </a>

        <!-- Instagram -->
        <a
          href="https://instagram.com/"
          target="_blank"
          rel="noopener noreferrer"
          class="sobre-btn sobre-btn-instagram"
        >
          Ver cardápio no Instagram
        </a>
      </section>
    </div>
  </div>

  <!-- Footer / Assinatura -->
  <footer class="sobre-footer">
    <p>
      Desenvolvido por
      <a
        href="https://www.dssystech.com"
        class="sobre-footer-link"
        target="_blank"
        rel="noopener noreferrer"
      >
        DS SysTech
      </a>
    </p>
  </footer>
</div>
