<div class="min-h-screen bg-gray-100 flex flex-col items-center justify-center p-4 font-sans">
  <div class="w-full max-w-sm bg-white p-8 rounded-2xl shadow-xl border border-gray-200">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div
        class="w-20 h-20 bg-primary-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg border-4 border-white"
      >
        <span class="text-4xl">🔐</span>
      </div>
      <h1 class="text-2xl font-black text-gray-900 tracking-tight">Acesso Restrito</h1>
      <p class="text-sm text-gray-500 font-medium mt-1">Área exclusiva para funcionários</p>
    </div>

    <!-- Mensagem de Erro -->
    @if (mensagemErro) {
      <div
        class="bg-red-50 text-red-600 p-3 rounded-lg text-sm font-bold text-center mb-6 border border-red-100 animate-pulse"
      >
        ⚠️ {{ mensagemErro }}
      </div>
    }

    <!-- Formulário -->
    <div class="space-y-5">
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">Usuário</label>
        <input
          type="text"
          [(ngModel)]="username"
          (keydown.enter)="fazerLogin()"
          class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl font-medium focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all outline-none"
          placeholder="Digite seu usuário"
        />
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">Senha</label>
        <input
          type="password"
          [(ngModel)]="password"
          (keydown.enter)="fazerLogin()"
          class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl font-medium focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all outline-none"
          placeholder="••••••••"
        />
      </div>

      <button
        (click)="fazerLogin()"
        [disabled]="isLoading"
        class="w-full mt-4 py-4 bg-primary-600 text-white rounded-xl font-black text-lg shadow-md hover:bg-primary-700 active:scale-95 transition-all disabled:opacity-70 flex justify-center items-center"
      >
        @if (isLoading) {
          ⏳ Validando...
        } @else {
          ENTRAR
        }
      </button>
    </div>

    <div class="mt-6 text-center">
      <a
        routerLink="/"
        class="text-sm font-bold text-gray-400 hover:text-gray-600 transition-colors"
      >
        ← Voltar para a loja
      </a>
    </div>
  </div>
</div>
