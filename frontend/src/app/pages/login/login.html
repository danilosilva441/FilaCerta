<main
  class="min-h-dvh bg-gradient-to-br from-primary-50 via-gray-50 to-primary-100 flex items-center justify-center p-4 font-sans pt-safe-top pb-safe-bottom"
  role="main"
  aria-labelledby="login-title"
>
  <section
    class="w-full max-w-sm bg-white p-7 sm:p-8 rounded-3xl shadow-card-hover border border-gray-200/80 animate-fade-in"
    role="form"
    aria-label="Formulário de acesso restrito"
  >
    <!-- HEADER -->
    <header class="text-center mb-7">
      <div
        class="w-20 h-20 rounded-2xl bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center mx-auto mb-4 shadow-lg shadow-primary-500/30 text-white ring-4 ring-white animate-bounce-in"
        aria-hidden="true"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="w-10 h-10"
        >
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          <circle cx="12" cy="16" r="1" fill="currentColor"></circle>
        </svg>
      </div>
      <h1 id="login-title" class="text-2xl font-black text-gray-900 tracking-tight">
        Acesso Restrito
      </h1>
      <p class="text-sm text-gray-500 font-medium mt-1">Área exclusiva para funcionários</p>
    </header>

    <!-- ERRO -->
    @if (mensagemErro) {
      <div
        class="flex items-center gap-2 bg-danger-light text-danger p-3 rounded-xl text-sm font-semibold border border-red-200 mb-5 animate-shake"
        role="alert"
        aria-live="polite"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="w-5 h-5 shrink-0"
          aria-hidden="true"
        >
          <path
            d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
          ></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <span>{{ mensagemErro }}</span>
      </div>
    }

    <!-- FORM -->
    <form class="space-y-5" (ngSubmit)="fazerLogin()" novalidate>
      <!-- Usuário -->
      <div>
        <label for="username" class="block text-sm font-bold text-gray-700 mb-1.5"> Usuário </label>
        <div class="relative flex items-center">
          <span
            class="absolute left-3.5 text-gray-400 pointer-events-none flex items-center justify-center transition-colors"
            aria-hidden="true"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="w-5 h-5"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <input
            id="username"
            type="text"
            name="username"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            [(ngModel)]="username"
            (keydown.enter)="fazerLogin()"
            class="w-full pl-11 pr-4 py-3.5 bg-gray-50 border border-gray-300 rounded-xl font-medium text-gray-900 placeholder:text-gray-400 focus:bg-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all duration-200 outline-none"
            placeholder="Digite seu usuário"
            aria-required="true"
          />
        </div>
      </div>

      <!-- Senha -->
      <div>
        <label for="password" class="block text-sm font-bold text-gray-700 mb-1.5"> Senha </label>
        <div class="relative flex items-center">
          <span
            class="absolute left-3.5 text-gray-400 pointer-events-none flex items-center justify-center transition-colors"
            aria-hidden="true"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="w-5 h-5"
            >
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input
            id="password"
            type="password"
            name="password"
            autocomplete="current-password"
            [(ngModel)]="password"
            (keydown.enter)="fazerLogin()"
            class="w-full pl-11 pr-4 py-3.5 bg-gray-50 border border-gray-300 rounded-xl font-medium text-gray-900 placeholder:text-gray-400 focus:bg-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all duration-200 outline-none"
            placeholder="••••••••"
            aria-required="true"
          />
        </div>
      </div>

      <!-- Botão Entrar -->
      <button
        type="submit"
        (click)="fazerLogin()"
        [disabled]="isLoading"
        class="w-full mt-4 py-4 px-6 bg-primary-600 text-white rounded-xl font-black text-base tracking-wide uppercase shadow-lg shadow-primary-600/25 hover:bg-primary-700 active:scale-[0.98] disabled:opacity-70 disabled:cursor-not-allowed transition-all duration-200 flex justify-center items-center gap-2 min-h-[56px] touch-manipulation"
        [attr.aria-busy]="isLoading"
      >
        @if (isLoading) {
          <svg
            class="w-5 h-5 animate-spin"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 0 1 8-8V0C5.4 0 0 5.4 0 12h4zm2 5.3A8 8 0 0 1 4 12H0c0 3.0 1.1 5.8 3 7.9l3-2.6z"
            ></path>
          </svg>
          <span>Validando...</span>
        } @else {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="w-5 h-5"
            aria-hidden="true"
          >
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          <span>ENTRAR</span>
        }
      </button>
    </form>

    <!-- FOOTER -->
    <footer class="mt-6 text-center">
      <a
        routerLink="/"
        class="inline-flex items-center gap-1.5 text-sm font-bold text-gray-400 hover:text-primary-600 transition-colors px-3 py-2 rounded-lg active:scale-95 touch-manipulation"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="w-4 h-4"
          aria-hidden="true"
        >
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Voltar para a loja</span>
      </a>
    </footer>
  </section>
</main>
