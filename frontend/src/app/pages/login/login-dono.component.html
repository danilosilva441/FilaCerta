<div class="min-h-screen bg-gray-900 flex flex-col">
  <div class="flex-1 flex flex-col items-center justify-center px-6">
    <!-- Logo -->
    <div class="w-20 h-20 bg-red-600/20 rounded-full flex items-center justify-center mb-6">
      <span class="material-icons text-4xl text-red-400">admin_panel_settings</span>
    </div>
    <h1 class="text-2xl font-bold text-white mb-2">Área do Dono</h1>
    <p class="text-gray-400 text-center mb-8">Acesso restrito ao estabelecimento</p>

    <!-- Card -->
    <div class="w-full max-w-sm bg-gray-800 rounded-2xl p-6 shadow-2xl border border-gray-700">
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1">Usuário</label>
          <input type="text" [ngModel]="username()" (ngModelChange)="username.set($event)"
            class="w-full px-4 py-3 rounded-xl bg-gray-700 border border-gray-600 text-white
                   placeholder:text-gray-400 focus:ring-2 focus:ring-red-500 focus:border-transparent"
            placeholder="Nome de usuário" autocomplete="username" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1">Senha</label>
          <div class="relative">
            <input [type]="showPassword() ? 'text' : 'password'"
              [ngModel]="password()" (ngModelChange)="password.set($event)"
              class="w-full px-4 py-3 rounded-xl bg-gray-700 border border-gray-600 text-white
                     placeholder:text-gray-400 focus:ring-2 focus:ring-red-500 focus:border-transparent pr-12"
              placeholder="Sua senha" autocomplete="current-password" />
            <button (click)="togglePassword()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white transition-colors" type="button">
              <span class="material-icons text-lg">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
            </button>
          </div>
        </div>

        @if (erro()) {
          <div class="bg-red-900/50 border border-red-700 text-red-300 text-sm p-3 rounded-lg flex items-start gap-2">
            <span class="material-icons text-lg">error</span> {{ mensagemErro() }}
          </div>
        }

        <button (click)="entrar()" [disabled]="!podeEntrar() || carregando()"
          class="w-full py-3 px-4 bg-red-600 text-white font-semibold rounded-xl
                 hover:bg-red-500 active:bg-red-700 disabled:opacity-50
                 disabled:cursor-not-allowed transition-all duration-200">
          @if (carregando()) {
            <span class="flex items-center justify-center gap-2">
              <span class="material-icons animate-spin text-lg">refresh</span> Entrando...
            </span>
          } @else { Entrar }
        </button>
      </div>

      <div class="mt-4 pt-4 border-t border-gray-700">
        <p class="text-xs text-gray-500 text-center">
          Usuários: <span class="text-gray-400">dono / admin / funcionario</span>
        </p>
      </div>
    </div>

    <a routerLink="/cliente/home" class="mt-6 text-gray-400 text-sm hover:text-white transition-colors flex items-center gap-1">
      <span class="material-icons text-sm">arrow_back</span> Voltar para o início
    </a>
  </div>
</div>
