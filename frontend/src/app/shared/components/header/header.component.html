<header class="bg-primary-600 text-white sticky top-0 z-20 shadow-md">
  <!--
    A classe pt-[max(0.75rem,env(safe-area-inset-top))] garante que o cabeçalho
    não fique escondido debaixo do relógio/notch do iPhone.
  -->
  <div class="flex items-center justify-between px-2 pb-2 pt-[max(0.75rem,env(safe-area-inset-top))]">

    <!-- Lado Esquerdo: Botão Voltar -->
    @if (showBack) {
      @if (backRoute) {
        <a
          [routerLink]="backRoute"
          class="w-12 h-12 flex items-center justify-center rounded-full shrink-0
                 hover:bg-primary-700 active:bg-primary-800 active:scale-90 transition-all"
          aria-label="Voltar"
        >
          <span class="material-icons">arrow_back</span>
        </a>
      } @else {
        <button
          (click)="goBack()"
          class="w-12 h-12 flex items-center justify-center rounded-full shrink-0
                 hover:bg-primary-700 active:bg-primary-800 active:scale-90 transition-all"
          aria-label="Voltar"
          type="button"
        >
          <span class="material-icons">arrow_back</span>
        </button>
      }
    } @else {
      <!-- Espaçador para manter o título perfeitamente centralizado -->
      <div class="w-12 shrink-0"></div>
    }

    <!-- Centro: Título -->
    <div class="flex-1 text-center px-2 min-w-0">
      <h1 class="text-lg font-bold truncate">{{ title }}</h1>
      @if (subtitle) {
        <p class="text-xs text-primary-200 truncate">{{ subtitle }}</p>
      }
    </div>

    <!-- Lado Direito: Ação opcional -->
    @if (rightAction) {
      <button
        (click)="rightAction.handler()"
        class="w-12 h-12 flex items-center justify-center rounded-full shrink-0
               hover:bg-primary-700 active:bg-primary-800 active:scale-90 transition-all"
        [attr.aria-label]="rightAction.label"
        type="button"
      >
        <span class="material-icons">{{ rightAction.icon }}</span>
      </button>
    } @else {
      <!-- Espaçador -->
      <div class="w-12 shrink-0"></div>
    }
  </div>
</header>
