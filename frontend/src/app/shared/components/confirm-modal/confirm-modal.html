@if (config) {
  <!-- ============================================================
       BACKDROP (clicável para fechar)
       ============================================================ -->
  <div
    class="modal-backdrop"
    [ngClass]="{
      'modal-backdrop-visivel': !saindo,
      'modal-backdrop-oculto': saindo,
    }"
    (click)="onBackdropClick($event)"
  >
    <!-- ============================================================
         CARD
         ============================================================ -->
    <div
      #modalCard
      class="modal-card"
      [ngClass]="{
        'modal-card-visivel': !saindo,
        'modal-card-saindo': saindo,
      }"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="modal-titulo"
      [attr.aria-describedby]="config.mensagem ? 'modal-mensagem' : null"
    >
      <!-- =========================
           CONTEÚDO
           ========================= -->
      <div class="modal-body">
        <!-- ÍCONE DINÂMICO -->
        <div
          class="modal-icon"
          [ngClass]="{
            'modal-icon-aviso': tipoEfetivo === 'aviso',
            'modal-icon-perigo': tipoEfetivo === 'perigo',
            'modal-icon-info': tipoEfetivo === 'info',
            'modal-icon-sucesso': tipoEfetivo === 'sucesso',
          }"
          aria-hidden="true"
        >
          @switch (tipoEfetivo) {
            @case ('perigo') {
              <!-- Lixeira -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="w-6 h-6"
              >
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                <path d="M10 11v6"></path>
                <path d="M14 11v6"></path>
                <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
              </svg>
            }
            @case ('info') {
              <!-- Info -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="w-6 h-6"
              >
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
              </svg>
            }
            @case ('sucesso') {
              <!-- Check com círculo -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="w-6 h-6"
              >
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
              </svg>
            }
            @default {
              <!-- Alerta triângulo (aviso) -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="w-6 h-6"
              >
                <path
                  d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
                ></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
              </svg>
            }
          }
        </div>

        <!-- TÍTULO -->
        <h3 id="modal-titulo" class="modal-title">
          {{ config.titulo }}
        </h3>

        <!-- MENSAGEM (só renderiza se existir) -->
        @if (config.mensagem) {
          <p id="modal-mensagem" class="modal-message">
            {{ config.mensagem }}
          </p>
        }
      </div>

      <!-- =========================
           AÇÕES
           ========================= -->
      <div class="modal-actions">
        <button type="button" (click)="fechar()" class="modal-btn-cancel">
          {{ config.textoCancelar || 'Cancelar' }}
        </button>

        <button
          #botaoConfirmar
          type="button"
          (click)="confirmar()"
          class="modal-btn-confirm"
          [ngClass]="{
            'modal-btn-perigo': tipoEfetivo === 'perigo',
            'modal-btn-primary': tipoEfetivo !== 'perigo',
          }"
        >
          {{ config.textoConfirmar || 'Confirmar' }}
        </button>
      </div>
    </div>
  </div>
}
