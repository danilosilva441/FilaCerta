@if (config) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-60 backdrop-blur-sm p-4 animate-[fadeIn_0.2s_ease-out]"
  >
    <div
      class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all"
    >
      <div class="p-6">
        <div class="w-12 h-12 rounded-full bg-yellow-100 flex items-center justify-center mb-4">
          <span class="text-2xl">⚠️</span>
        </div>
        <h3 class="text-xl font-black text-gray-900 mb-2">{{ config.titulo }}</h3>
        <p class="text-gray-600 font-medium">{{ config.mensagem }}</p>
      </div>

      <div class="bg-gray-50 px-6 py-4 flex gap-3 justify-end border-t border-gray-100">
        <button
          (click)="fechar()"
          class="px-5 py-2.5 rounded-lg font-bold text-gray-600 hover:bg-gray-200 transition-colors"
        >
          {{ config.textoCancelar || 'Cancelar' }}
        </button>
        <button
          (click)="confirmar()"
          class="px-5 py-2.5 rounded-lg font-bold text-white bg-primary-600 hover:bg-primary-700 shadow-md transition-colors"
        >
          {{ config.textoConfirmar || 'Confirmar' }}
        </button>
      </div>
    </div>
  </div>
}
