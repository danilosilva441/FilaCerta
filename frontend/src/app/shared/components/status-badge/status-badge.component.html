<span
  class="inline-flex items-center rounded-full font-medium select-none shrink-0"
  [class]="colorClass + ' ' + sizeClass"
  [class.animate-pulse]="isPreparing"
  [attr.aria-label]="displayLabel"
  role="status"
>
  <!-- Ícone -->
  @if (showIcon) {
    <span
      class="material-icons leading-none"
      [class.text-sm]="size === 'md'"
      [class.text-xs]="size === 'sm'"
      aria-hidden="true"
    >
      {{ icon }}
    </span>
  }

  <!-- Texto -->
  <span class="whitespace-nowrap">{{ displayLabel }}</span>
</span>
