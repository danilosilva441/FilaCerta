<div
  *ngIf="visible"
  class="fixed inset-0 z-50 flex items-center justify-center p-4"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="'dialog-title'"
>
  <!-- Overlay -->
  <div
    class="absolute inset-0 bg-black/50 animate-fade-in"
    (click)="onCancel.emit()"
    (keydown.escape)="onCancel.emit()"
  ></div>

  <!-- Dialog -->
  <div class="relative bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 animate-bounce-in">
    <!-- Ícone -->
    <div class="text-center mb-4">
      <span
        class="material-icons text-5xl"
        [class]="iconColorClass"
        aria-hidden="true"
      >
        {{ icon }}
      </span>
    </div>

    <!-- Título -->
    <h3
      id="dialog-title"
      class="text-lg font-semibold text-gray-800 text-center mb-2"
    >
      {{ title }}
    </h3>

    <!-- Mensagem -->
    <p class="text-sm text-gray-500 text-center mb-6">
      {{ message }}
    </p>

    <!-- Botões -->
    <div class="flex gap-3">
      <button
        (click)="onCancel.emit()"
        class="flex-1 py-2.5 px-4 rounded-xl border border-gray-300
               text-gray-700 font-medium hover:bg-gray-50
               active:bg-gray-100 transition-colors"
        type="button"
      >
        {{ cancelText }}
      </button>
      <button
        (click)="onConfirm.emit()"
        class="flex-1 py-2.5 px-4 rounded-xl text-white font-medium
               transition-colors active:scale-95"
        [class]="confirmButtonClass"
        type="button"
      >
        {{ confirmText }}
      </button>
    </div>
  </div>
</div>
