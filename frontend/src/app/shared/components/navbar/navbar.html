<!-- ============================================================
     NAVEGAÇÃO PRINCIPAL
     Mobile: bottom nav fixa | Desktop: top nav sticky
     ============================================================ -->
<nav class="bottom-nav" aria-label="Navegação principal" role="navigation">
  <div class="bottom-nav-inner">
    <div class="bottom-nav-row">
      <!-- =========================
           LOGO (só desktop)
           ========================= -->
      <a routerLink="/" class="bottom-nav-logo" aria-label="Ir para a página inicial">
        <!-- Ícone: pilha de pratos / fila -->
        <svg
          class="w-7 h-7 text-primary-400"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M3 11a9 9 0 0 1 18 0"></path>
          <path d="M3 11h18"></path>
          <path d="M5 11a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3"></path>
          <path d="M4 16h16"></path>
          <path d="M5 20h14"></path>
        </svg>
        <span class="font-black tracking-wider text-xl">Painel Fila Certa</span>
      </a>

      <!-- =========================
           LINKS
           ========================= -->
      <ul class="bottom-nav-links" role="list">
        <!-- Cardápio -->
        <li class="bottom-nav-item">
          <a
            routerLink="/cliente/cardapio"
            routerLinkActive="bottom-nav-active"
            [routerLinkActiveOptions]="{ exact: false }"
            class="bottom-nav-link"
          >
            <svg
              class="bottom-nav-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 4h16v16H4z"></path>
              <path d="M8 8h8"></path>
              <path d="M8 12h8"></path>
              <path d="M8 16h5"></path>
            </svg>
            <span class="bottom-nav-label">Cardápio</span>
          </a>
        </li>

        <!-- Cozinha -->
        <li class="bottom-nav-item">
          <a
            routerLink="/cozinha/painel"
            routerLinkActive="bottom-nav-active"
            [routerLinkActiveOptions]="{ exact: false }"
            class="bottom-nav-link"
          >
            <svg
              class="bottom-nav-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6z"
              ></path>
              <path d="M6 17h12"></path>
            </svg>
            <span class="bottom-nav-label">Cozinha</span>
          </a>
        </li>

        <!-- Estoque -->
        <li class="bottom-nav-item">
          <a
            routerLink="/estoque/painel"
            routerLinkActive="bottom-nav-active"
            [routerLinkActiveOptions]="{ exact: false }"
            class="bottom-nav-link"
          >
            <svg
              class="bottom-nav-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"
              ></path>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
              <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
            <span class="bottom-nav-label">Estoque</span>
          </a>
        </li>

        <!-- Caixa -->
        <li class="bottom-nav-item">
          <a
            routerLink="/caixa/painel"
            routerLinkActive="bottom-nav-active"
            [routerLinkActiveOptions]="{ exact: false }"
            class="bottom-nav-link"
          >
            <svg
              class="bottom-nav-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="2" y="6" width="20" height="12" rx="2"></rect>
              <path d="M2 10h20"></path>
              <circle cx="16" cy="14" r="1.5"></circle>
            </svg>
            <span class="bottom-nav-label">Caixa</span>
          </a>
        </li>

        <!-- Sair -->
        <li class="bottom-nav-item">
          <button
            type="button"
            (click)="confirmarLogout()"
            class="bottom-nav-link bottom-nav-logout"
            aria-label="Sair do sistema"
          >
            <svg
              class="bottom-nav-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span class="bottom-nav-label">Sair</span>
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- ============================================================
     MODAL DE CONFIRMAÇÃO DE LOGOUT
     ============================================================ -->
@if (mostrarConfirmacao) {
  <div
    class="modal-backdrop"
    (click)="cancelarLogout()"
    role="dialog"
    aria-modal="true"
    aria-labelledby="titulo-logout"
  >
    <div class="modal-card modal-card-alert" (click)="$event.stopPropagation()">
      <div class="modal-body">
        <div class="modal-icon modal-icon-perigo" aria-hidden="true">
          <svg
            class="w-8 h-8 text-red-600"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </div>
        <h3 id="titulo-logout" class="modal-title modal-title-alert">Sair do sistema?</h3>
        <p class="modal-message">Você precisará fazer login novamente...</p>
      </div>
      <div class="modal-actions modal-actions-alert">
        <button class="modal-btn-cancel" (click)="cancelarLogout()">Cancelar</button>
        <button class="modal-btn-confirm modal-btn-perigo" (click)="logout()">Sim, sair</button>
      </div>
    </div>
  </div>
}
