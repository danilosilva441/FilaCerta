<!-- ============================================================
     TOAST CONTAINER — Global
     Mobile-first: safe-areas, posição adaptativa, acessível
     ============================================================ -->
<div class="toast-container" role="region" aria-label="Notificações">
  @for (item of toasts; track item.id) {
    <div
      class="toast"
      [ngClass]="{
        'toast-sucesso': item.tipo === 'sucesso',
        'toast-erro': item.tipo === 'erro',
        'toast-aviso': item.tipo === 'aviso',
        'toast-info': item.tipo === 'info',
        'toast-entrando': !item.saindo,
        'toast-saindo': item.saindo,
      }"
      [attr.role]="item.tipo === 'erro' ? 'alert' : 'status'"
      [attr.aria-live]="item.tipo === 'erro' ? 'assertive' : 'polite'"
    >
      <!-- =========================
           LINHA PRINCIPAL
           ========================= -->
      <div class="toast-row">
        <!-- ÍCONE CIRCULAR -->
        <div
          class="toast-icon"
          [ngClass]="{
            'toast-icon-sucesso': item.tipo === 'sucesso',
            'toast-icon-erro': item.tipo === 'erro',
            'toast-icon-aviso': item.tipo === 'aviso',
            'toast-icon-info': item.tipo === 'info',
          }"
          aria-hidden="true"
        >
          @switch (item.tipo) {
            @case ('sucesso') {
              <!-- Check -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="w-5 h-5"
              >
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            }
            @case ('erro') {
              <!-- X -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="w-5 h-5"
              >
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            }
            @case ('aviso') {
              <!-- Alerta triângulo -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="w-5 h-5"
              >
                <path
                  d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
                ></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
              </svg>
            }
            @default {
              <!-- Info -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="w-5 h-5"
              >
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
              </svg>
            }
          }
        </div>

        <!-- CONTEÚDO (título + mensagem) -->
        <div class="toast-content">
          <h4
            class="toast-title"
            [ngClass]="{
              'toast-title-sucesso': item.tipo === 'sucesso',
              'toast-title-erro': item.tipo === 'erro',
              'toast-title-aviso': item.tipo === 'aviso',
              'toast-title-info': item.tipo === 'info',
            }"
          >
            {{ item.titulo }}
          </h4>
          <p class="toast-message">{{ item.mensagem }}</p>
        </div>

        <!-- BOTÃO FECHAR -->
        <button
          type="button"
          (click)="removerToast(item.id)"
          class="toast-close"
          aria-label="Fechar notificação"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="w-4 h-4"
            aria-hidden="true"
          >
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- =========================
           AÇÕES (opcional)
           ========================= -->
      @if (item.textoAcao) {
        <div class="toast-actions">
          <button type="button" (click)="removerToast(item.id)" class="toast-btn-cancel">
            {{ item.textoCancelar }}
          </button>

          <button
            type="button"
            (click)="executarAcao(item)"
            class="toast-btn-confirm"
            [ngClass]="{
              'toast-btn-sucesso': item.tipo === 'sucesso',
              'toast-btn-erro': item.tipo === 'erro',
              'toast-btn-aviso': item.tipo === 'aviso',
              'toast-btn-info': item.tipo === 'info',
            }"
          >
            {{ item.textoAcao }}
          </button>
        </div>
      }

      <!-- =========================
           BARRA DE PROGRESSO
           ========================= -->
      @if (!item.saindo) {
        <div
          class="toast-progress"
          [ngClass]="{
            'toast-progress-sucesso': item.tipo === 'sucesso',
            'toast-progress-erro': item.tipo === 'erro',
            'toast-progress-aviso': item.tipo === 'aviso',
            'toast-progress-info': item.tipo === 'info',
          }"
          aria-hidden="true"
        ></div>
      }
    </div>
  }
</div>
