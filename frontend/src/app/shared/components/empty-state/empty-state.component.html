<div class="flex flex-col items-center justify-center py-16 px-4 text-center">
  <!-- Ícone -->
  <span
    class="material-icons text-6xl text-gray-300 mb-4 select-none"
    aria-hidden="true"
  >
    {{ icon }}
  </span>

  <!-- Título -->
  <h3 class="text-lg font-semibold text-gray-700 mb-2">
    {{ title }}
  </h3>

  <!-- Descrição (opcional) -->
  <p
    *ngIf="description"
    class="text-sm text-gray-500 max-w-xs"
  >
    {{ description }}
  </p>

  <!-- Slot para ações (projeção de conteúdo) -->
  <ng-content></ng-content>
</div>
