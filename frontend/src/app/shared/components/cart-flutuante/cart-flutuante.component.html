<div
  *ngIf="itens.length > 0"
  class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200
         shadow-bottom-sheet z-30 rounded-t-2xl animate-slide-up"
>
  <div class="p-4">
    <!-- Resumo -->
    <div class="flex justify-between items-center mb-3">
      <div>
        <span class="font-semibold text-lg">
          Total: R$ {{ total | number:'1.2-2' }}
        </span>
        <span class="text-sm text-gray-500 ml-2">
          ({{ totalItens }} {{ totalItens === 1 ? 'item' : 'itens' }})
        </span>
      </div>
      <button
        (click)="onClear.emit()"
        class="text-sm text-red-500 hover:text-red-700 active:text-red-800
               transition-colors"
        type="button"
      >
        Limpar
      </button>
    </div>

    <!-- Lista de itens -->
    <div class="max-h-32 overflow-y-auto mb-3 space-y-1">
      <div
        *ngFor="let item of itens; trackBy: trackByProduto"
        class="flex justify-between items-center text-sm"
      >
        <span class="text-gray-700 truncate mr-2">
          {{ item.quantidade }}x {{ item.produto.nome }}
        </span>
        <span class="text-gray-500 shrink-0">
          R$ {{ (item.produto.preco * item.quantidade) | number:'1.2-2' }}
        </span>
      </div>
    </div>

    <!-- Botão Confirmar -->
    <button
      (click)="onConfirm.emit()"
      [disabled]="disabled"
      class="btn-primary"
      type="button"
    >
      {{ buttonText }}
    </button>
  </div>
</div>
