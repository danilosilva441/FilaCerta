server {
    listen 80;
    listen [::]:80; # <-- ESTA É A LINHA MÁGICA PARA O ROTEADOR DO RAILWAY
    server_name localhost;

    # 🔸 FRONTEND SPA (Angular)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 🔸 ROTAS DE API (Proxy para a rede privada do Railway)
    location /api/ {
        # O Angular chama /api no navegador.
        # O Nginx intercepta e manda pela rede privada direto pro Spring Boot.
        proxy_pass http://eloquent-victory.railway.internal:8080/api/;

        # Headers de Proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
