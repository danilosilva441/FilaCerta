server {
    listen 80;
    server_name localhost;

    # Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        # Trocamos "backend:8080" pela URL pública real do seu backend no Railway
        proxy_pass https://backend-production-a436.up.railway.app/api/;

        # O Host original foi removido para não confundir a rede do Railway
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI
    location /swagger-ui/ {
        proxy_pass https://backend-production-a436.up.railway.app/swagger-ui/;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API Docs
    location /api-docs/ {
        proxy_pass https://backend-production-a436.up.railway.app/api-docs/;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Actuator
    location /actuator/ {
        proxy_pass https://backend-production-a436.up.railway.app/actuator/;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
