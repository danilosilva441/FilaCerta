spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:file:~/filacerta;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    defer-datasource-initialization: true

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  flyway:
    enabled: false  # ← MANTER false para evitar circular
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8
    out-of-order: false
    validate-on-migrate: true

logging:
  level:
    com.filacerta: DEBUG
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG